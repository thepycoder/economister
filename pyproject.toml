[project]
name = "economister"
version = "0.1.0"
description = "Convert The Economist weekly edition to EPUB for offline reading"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Economister contributors" }]
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
  "requests>=2.32.3,<3",
  "selenium>=4.26.1,<5",
  "ebooklib>=0.18,<0.19",
  "Pillow>=11.0.0,<12",
  "lxml>=5.3.0,<6",
  "python-dotenv>=1.0.1,<2",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
